services:
  - type: web
    name: kant-consulting
    runtime: node
    plan: free
    buildCommand: pnpm install && pnpm exec playwright install --with-deps chromium && pnpm build
    startCommand: pnpm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: "0"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: NEXT_SERVER_ACTIONS_ENCRYPTION_KEY
        generateValue: true
      - key: CUSTOM_PROVIDERS_JSON
        sync: false
      - key: DEFAULT_PROVIDER
        value: x100
      - key: DEFAULT_MODEL
        value: claude-opus-4-8
